name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-final:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (Final)
        working-directory: Final
        run: mvn -B clean package

      - name: Run tests (Final)
        working-directory: Final
        run: mvn -B test

      - name: Upload build artifact (Final)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-build-output
          path: Final/target/*.jar

  build-restassured-dummyjson:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (restassured-dummyjson)
        working-directory: restassured-dummyjson
        run: mvn -B clean package

      - name: Run tests (restassured-dummyjson)
        working-directory: restassured-dummyjson
        run: mvn -B test

      - name: Upload build artifact (restassured-dummyjson)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: restassured-dummyjson-build-output
          path: restassured-dummyjson/target/*.jar
